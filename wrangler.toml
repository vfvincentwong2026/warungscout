# ============================================================
# WarungScout Cloudflare Workers 配置
# 部署: npx wrangler deploy
# 本地开发: npx wrangler dev
# ============================================================

name = "warungscout"
main = "src/api/index.py"
compatibility_date = "2024-12-18"

# ---------- Python 配置 ----------
[python]
python_compat = "python3.10"

# ---------- D1 数据库绑定 ----------
# 本地开发时使用 --local 模式，自动使用本地 SQLite
# 生产环境需先在 Cloudflare Dashboard 创建 D1 数据库
[[d1_databases]]
binding = "DB"                           # 代码中通过 binding 名称访问
database_name = "warungscout_db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"  # 替换为实际数据库 ID

# ---------- KV 命名空间绑定（会话管理/缓存） ----------
[[kv_namespaces]]
binding = "KV"
id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"  # 替换为实际 KV 命名空间 ID

# ---------- 静态资源绑定（前端构建产物） ----------
[assets]
binding = "ASSETS"
directory = "./dist"                     # React/Vite 构建输出目录

# ---------- 环境变量 ----------
# 敏感信息使用 Cloudflare Secrets 管理，不要硬编码
# 设置方式: npx wrangler secret put SERPAPI_API_KEY

[vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"

# ---------- 路由规则 ----------
[ routes ]
"*.warungscout.com/*" = "worker"

# ---------- 生产环境配置 ----------
[env.production]
vars = { ENVIRONMENT = "production", LOG_LEVEL = "info" }

[env.production.d1_databases]
binding = "DB"
database_name = "warungscout_db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# ---------- 预览环境配置 ----------
[env.preview]
vars = { ENVIRONMENT = "preview", LOG_LEVEL = "debug" }

[env.preview.d1_databases]
binding = "DB"
database_name = "warungscout_db_preview"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# ---------- 本地开发配置 ----------
[env.local]
vars = { ENVIRONMENT = "local", LOG_LEVEL = "debug" }

[env.local.d1_databases]
binding = "DB"
database_name = "warungscout_db_local"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
